<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>海外購物清單</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FBF8F1">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FBF8F1',
            paperCard: '#FFFDF9',
            borderDotted: '#D9C3B0',
            brandBrown: '#5C4636',
            brandLightBrown: '#8C725E',
            accentOrange: '#E07A5F',
            accentGreen: '#81B29A',
            softGray: '#EFECE6'
          },
          fontFamily: {
            handwriting: ['"Zen Maru Gothic"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FBF8F1;
      font-family: 'Zen Maru Gothic', sans-serif;
      color: #5C4636;
      -webkit-tap-highlight-color: transparent;
    }
    .dotted-box { 
      border: 2px dashed #D9C3B0; 
      border-radius: 20px; 
    }
    .custom-checkbox {
      width: 22px; height: 22px; border: 2px solid #E07A5F; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; cursor: pointer;
    }
    .custom-checkbox.checked { background-color: #E07A5F; }
    .custom-checkbox.checked::after { content: '✓'; color: white; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body class="pb-12 pt-6 px-4 max-w-md mx-auto min-h-screen relative">

  <!-- 頂部大虛線外框標題區 -->
  <div class="dotted-box bg-paperCard p-6 text-center mb-5 shadow-sm">
    <div class="flex items-center justify-center gap-2 mb-2 cursor-pointer hover:opacity-80 transition" onclick="editMainTitle()">
      <i class="fa-solid fa-pen-nib text-accentOrange text-2xl"></i>
      <h1 id="mainTitleText" class="text-2xl font-bold text-brandBrown tracking-wide">海外購物清單</h1>
    </div>
    <div id="subTitleText" onclick="editSubTitle()" class="text-xs text-brandLightBrown cursor-pointer hover:opacity-80 transition">
      點擊此處可修改副標題與備註說明
    </div>
  </div>

  <!-- 數據統計與新增分類 -->
  <div class="bg-paperCard dotted-box p-3.5 mb-4 shadow-sm">
    <div class="flex justify-between items-center mb-2">
      <div class="text-xs font-bold text-brandBrown">
        已完成: <span id="completedCount" class="text-accentGreen">0</span>/<span id="totalCount">0</span>
      </div>
      <div class="flex items-center gap-1">
        <select id="currencySelect" onchange="changeCurrency(this.value)" class="bg-white border border-dottedBorder rounded-lg px-2 py-0.5 text-xs font-bold text-brandBrown focus:outline-none cursor-pointer">
          <option value="JPY">🇯🇵 日幣 (JPY)</option>
          <option value="KRW">🇰🇷 韓元 (KRW)</option>
          <option value="CNY">🇨🇳 人民幣 (CNY)</option>
          <option value="THB">🇹🇭 泰銖 (THB)</option>
          <option value="SGD">🇸🇬 新加坡幣 (SGD)</option>
          <option value="MYR">🇲🇾 馬來西亞幣 (MYR)</option>
          <option value="EUR">🇪🇺 歐元 (EUR)</option>
          <option value="NZD">🇳🇿 紐西蘭幣 (NZD)</option>
          <option value="AUD">🇦🇺 澳幣 (AUD)</option>
          <option value="HKD">🇭🇰 港幣 (HKD)</option>
          <option value="MOP">🇲🇴 澳門幣 (MOP)</option>
          <option value="IDR">🇮🇩 印尼盾 (IDR)</option>
        </select>
        <button onclick="addNewGroup()" class="bg-[#5C4636] text-paper px-3 py-1 rounded-full text-xs font-bold shadow active:scale-95 transition flex items-center gap-1 ml-1">
          <i class="fa-solid fa-plus"></i> 新增分類
        </button>
      </div>
    </div>

    <!-- 預算總計與台幣換算顯示 -->
    <div class="flex items-baseline justify-between pt-1 border-t border-dottedBorder/60">
      <div class="text-xs font-bold text-brandLightBrown">總預算金額:</div>
      <div class="text-right">
        <div class="text-base font-bold text-accentOrange">
          <span id="totalPrice">0</span> <span id="currencyUnit">円</span>
        </div>
        <div class="text-[11px] font-bold text-brandLightBrown/80">
          約 NT$ <span id="totalTwdPrice">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 商品分類區塊 -->
  <div id="groupList" class="space-y-4 mb-4"></div>

  <!-- 獨立折價券區塊（最下方） -->
  <div class="dotted-box bg-paperCard p-3 transition-all">
    <div class="flex justify-between items-center ${appData?.couponCollapsed ? '' : 'pb-2 mb-2 border-b border-dottedBorder/60'}">
      <div class="flex items-center gap-2 cursor-pointer flex-1" onclick="toggleCouponSection()">
        <i id="couponCaret" class="fa-solid fa-caret-down text-accentOrange"></i>
        <span class="font-bold text-sm text-brandBrown"><i class="fa-solid fa-ticket text-accentOrange mr-1"></i>優惠券 & 折價券</span>
      </div>
      <button onclick="addCoupon()" class="text-xs text-accentGreen font-bold hover:underline"><i class="fa-solid fa-plus"></i> 新增優惠券</button>
    </div>
    <div id="couponList" class="grid grid-cols-2 gap-2.5"></div>
  </div>

  <script>
    if (window.location.search.includes('reset=1')) {
      localStorage.removeItem('handbook_shopping_data');
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    // 各幣別名稱、單位與預設對台幣匯率
    const currencyConfig = {
      JPY: { name: '日幣', unit: '円', rate: 0.21 },
      KRW: { name: '韓元', unit: '₩', rate: 0.024 },
      CNY: { name: '人民幣', unit: '¥', rate: 4.4 },
      THB: { name: '泰銖', unit: '฿', rate: 0.92 },
      SGD: { name: '新加坡幣', unit: 'S$', rate: 24.5 },
      MYR: { name: '馬來西亞幣', unit: 'RM', rate: 7.2 },
      EUR: { name: '歐元', unit: '€', rate: 35.0 },
      NZD: { name: '紐西蘭幣', unit: 'NZ$', rate: 19.5 },
      AUD: { name: '澳幣', unit: 'A$', rate: 21.2 },
      HKD: { name: '港幣', unit: 'HK$', rate: 4.1 },
      MOP: { name: '澳門幣', unit: 'MOP$', rate: 3.9 },
      IDR: { name: '印尼盾', unit: 'Rp', rate: 0.0020 }
    };

    const defaultData = {
      mainTitle: '海外購物清單',
      subTitle: '點擊此處可修改副標題與備註說明',
      currency: 'JPY',
      couponCollapsed: false,
      coupons: [
        { id: 'c1', name: '唐吉訶德優惠券', note: '免稅10% + 5%折扣', image: '' }
      ],
      groups: [
        {
          id: 'g1',
          name: '藥妝店',
          collapsed: false,
          items: [
            { id: 'i1', name: '資生堂吸油面紙', note: '', price: '', image: '', checked: false },
            { id: 'i2', name: 'Love Liner 眉筆', note: '自然棕', price: '1200', image: '', checked: false }
          ]
        }
      ]
    };

    let appData;
    try {
      appData = JSON.parse(localStorage.getItem('handbook_shopping_data')) || defaultData;
      if (!appData.groups || !Array.isArray(appData.groups)) appData = defaultData;
      if (!appData.coupons) appData.coupons = defaultData.coupons;
      if (!appData.mainTitle) appData.mainTitle = defaultData.mainTitle;
      if (!appData.currency) appData.currency = 'JPY';
    } catch(e) {
      appData = defaultData;
    }

    let activeImageTarget = null;

    function saveData(skipRender = false) {
      localStorage.setItem('handbook_shopping_data', JSON.stringify(appData));
      if (!skipRender) render();
    }

    function changeCurrency(curr) {
      appData.currency = curr;
      saveData();
    }

    function editMainTitle() {
      const newTitle = prompt("修改主標題：", appData.mainTitle || "海外購物清單");
      if (newTitle !== null && newTitle.trim() !== "") {
        appData.mainTitle = newTitle.trim();
        saveData();
      }
    }

    function editSubTitle() {
      const newText = prompt("修改副標題與備註說明：", appData.subTitle || "點擊此處可修改副標題與備註說明");
      if (newText !== null) {
        appData.subTitle = newText;
        saveData();
      }
    }

    // 計算並即時更新頂部總金額、台幣換算與統計數據
    function calculateTotals() {
      let totalItems = 0, completedItems = 0, totalPriceSum = 0;

      (appData.groups || []).forEach(group => {
        const items = group.items || [];
        totalItems += items.length;
        completedItems += items.filter(i => i.checked).length;

        items.forEach(i => {
          if (i.price) {
            const cleanPrice = String(i.price).replace(/,/g, '');
            const numMatch = cleanPrice.match(/\d+(\.\d+)?/);
            if (numMatch) {
              totalPriceSum += parseFloat(numMatch[0]);
            }
          }
        });
      });

      const curr = appData.currency || 'JPY';
      const config = currencyConfig[curr] || currencyConfig.JPY;
      const twdSum = Math.round(totalPriceSum * config.rate);

      document.getElementById('completedCount').innerText = completedItems;
      document.getElementById('totalCount').innerText = totalItems;
      document.getElementById('totalPrice').innerText = totalPriceSum.toLocaleString();
      document.getElementById('currencyUnit').innerText = config.unit;
      document.getElementById('totalTwdPrice').innerText = twdSum.toLocaleString();
    }

    function render() {
      // 渲染主標題與網頁標籤
      const currentMainTitle = appData.mainTitle || '海外購物清單';
      document.getElementById('mainTitleText').innerText = currentMainTitle;
      document.title = currentMainTitle;

      // 渲染副標題
      document.getElementById('subTitleText').innerText = appData.subTitle || '點擊此處可修改副標題與備註說明';

      // 設定幣別選單值
      document.getElementById('currencySelect').value = appData.currency || 'JPY';

      // 渲染商品分類
      const groupList = document.getElementById('groupList');
      groupList.innerHTML = '';

      (appData.groups || []).forEach(group => {
        const items = group.items || [];
        const groupCount = items.length;
        const groupCheckedCount = items.filter(i => i.checked).length;

        const isCollapsed = group.collapsed;
        const groupEl = document.createElement('div');
        groupEl.className = 'dotted-box bg-paperCard p-3 transition-all';
        
        const headerClass = isCollapsed 
          ? 'flex justify-between items-center' 
          : 'flex justify-between items-center pb-2 mb-2 border-b border-dottedBorder/60';

        groupEl.innerHTML = `
          <div class="${headerClass}">
            <div class="flex items-center gap-2 cursor-pointer flex-1" onclick="toggleGroup('${group.id}')">
              <i class="fa-solid ${isCollapsed ? 'fa-caret-right' : 'fa-caret-down'} text-accentOrange"></i>
              <span class="font-bold text-sm text-brandBrown" onclick="event.stopPropagation(); editGroupName('${group.id}')">${escapeHtml(group.name)}</span>
              <span class="text-xs text-brandLightBrown">(${groupCheckedCount}/${groupCount})</span>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="addItem('${group.id}')" class="text-xs text-accentGreen font-bold hover:underline"><i class="fa-solid fa-plus"></i> 新增項目</button>
              <button onclick="deleteGroup('${group.id}')" class="text-xs text-gray-400 hover:text-red-400"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
          <div class="${isCollapsed ? 'hidden' : 'grid grid-cols-2 gap-2.5'}">
            ${items.map(item => {
              const isImageActive = activeImageTarget && activeImageTarget.type === 'item' && activeImageTarget.gId === group.id && activeImageTarget.iId === item.id;
              return `
              <div class="bg-paper p-2 rounded-xl border border-dottedBorder relative flex flex-col shadow-sm">
                <button onclick="deleteItem('${group.id}', '${item.id}')" class="absolute top-1 right-1 text-gray-300 hover:text-red-400 text-xs z-10 p-1"><i class="fa-solid fa-xmark"></i></button>
                <div onclick="selectItemImageZone('${group.id}', '${item.id}')" class="relative w-full h-24 bg-softGray rounded-lg overflow-hidden mb-1.5 flex items-center justify-center cursor-pointer transition-all ${isImageActive ? 'ring-2 ring-accentOrange border-2 border-accentOrange' : ''}">
                  ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-image text-2xl text-gray-300"></i>`}
                  <label class="absolute bottom-1 right-1 bg-brandBrown/80 text-white rounded-full w-6 h-6 flex items-center justify-center cursor-pointer shadow" onclick="event.stopPropagation();">
                    <i class="fa-solid fa-camera text-[10px]"></i>
                    <input type="file" accept="image/*" class="hidden" onchange="uploadItemImage(event, '${group.id}', '${item.id}')">
                  </label>
                </div>
                <div class="flex items-center gap-1.5 mb-1">
                  <div class="custom-checkbox ${item.checked ? 'checked' : ''} flex-shrink-0" onclick="toggleCheck('${group.id}', '${item.id}')"></div>
                  <input type="text" value="${escapeHtml(item.name)}" placeholder="商品名稱" oninput="updateItemInMemory('${group.id}', '${item.id}', 'name', this.value)" onchange="saveData()" class="bg-transparent text-xs font-bold text-brandBrown w-full focus:outline-none ${item.checked ? 'line-through text-gray-400' : ''}">
                </div>
                <input type="text" value="${escapeHtml(item.note)}" placeholder="顏色/數量/備註..." oninput="updateItemInMemory('${group.id}', '${item.id}', 'note', this.value)" onchange="saveData()" class="bg-white/80 px-2 py-0.5 rounded text-[11px] text-brandLightBrown w-full mb-1 border border-dottedBorder focus:outline-none">
                <input type="text" value="${escapeHtml(item.price)}" placeholder="金額" oninput="updateItemInMemory('${group.id}', '${item.id}', 'price', this.value)" onchange="saveData()" class="bg-white/80 px-2 py-0.5 rounded text-[11px] text-left text-brandBrown w-full border border-dottedBorder focus:outline-none font-mono">
              </div>
            `}).join('')}
          </div>
        `;
        groupList.appendChild(groupEl);
      });

      // 渲染優惠券區塊
      const couponList = document.getElementById('couponList');
      const couponCaret = document.getElementById('couponCaret');
      const couponHeader = couponList.previousElementSibling;
      couponList.innerHTML = '';
      
      if (appData.couponCollapsed) {
        couponList.classList.add('hidden');
        couponCaret.className = 'fa-solid fa-caret-right text-accentOrange';
        couponHeader.className = 'flex justify-between items-center';
      } else {
        couponList.classList.remove('hidden');
        couponCaret.className = 'fa-solid fa-caret-down text-accentOrange';
        couponHeader.className = 'flex justify-between items-center pb-2 mb-2 border-b border-dottedBorder/60';

        (appData.coupons || []).forEach(coupon => {
          const isImageActive = activeImageTarget && activeImageTarget.type === 'coupon' && activeImageTarget.cId === coupon.id;
          const couponEl = document.createElement('div');
          couponEl.className = 'bg-paper p-2 rounded-xl border border-dottedBorder relative flex flex-col shadow-sm';
          couponEl.innerHTML = `
            <button onclick="deleteCoupon('${coupon.id}')" class="absolute top-1 right-1 text-gray-300 hover:text-red-400 text-xs z-10 p-1"><i class="fa-solid fa-xmark"></i></button>
            <div onclick="selectCouponImageZone('${coupon.id}')" class="relative w-full h-24 bg-softGray rounded-lg overflow-hidden mb-1.5 flex items-center justify-center cursor-pointer transition-all ${isImageActive ? 'ring-2 ring-accentOrange border-2 border-accentOrange' : ''}">
              ${coupon.image ? `<img src="${coupon.image}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-ticket text-2xl text-gray-300"></i>`}
              <label class="absolute bottom-1 right-1 bg-brandBrown/80 text-white rounded-full w-6 h-6 flex items-center justify-center cursor-pointer shadow" onclick="event.stopPropagation();">
                <i class="fa-solid fa-camera text-[10px]"></i>
                <input type="file" accept="image/*" class="hidden" onchange="uploadCouponImage(event, '${coupon.id}')">
              </label>
            </div>
            <input type="text" value="${escapeHtml(coupon.name)}" placeholder="優惠券名稱" oninput="updateCouponInMemory('${coupon.id}', 'name', this.value)" onchange="saveData()" class="bg-transparent text-xs font-bold text-brandBrown w-full mb-1 focus:outline-none">
            <input type="text" value="${escapeHtml(coupon.note)}" placeholder="折扣碼 / 門檻..." oninput="updateCouponInMemory('${coupon.id}', 'note', this.value)" onchange="saveData()" class="bg-white/80 px-2 py-0.5 rounded text-[11px] text-brandLightBrown w-full border border-dottedBorder focus:outline-none">
          `;
          couponList.appendChild(couponEl);
        });
      }

      // 更新計算結果
      calculateTotals();
    }

    // 折價券操作
    function toggleCouponSection() { appData.couponCollapsed = !appData.couponCollapsed; saveData(); }
    function addCoupon() { appData.coupons.push({ id: 'c_' + Date.now(), name: '新優惠券', note: '', image: '' }); appData.couponCollapsed = false; saveData(); }
    function deleteCoupon(id) { appData.coupons = appData.coupons.filter(c => c.id !== id); saveData(); }
    function updateCouponInMemory(cId, field, val) { const c = appData.coupons.find(x => x.id === cId); if(c) c[field] = val; }
    function selectCouponImageZone(cId) { activeImageTarget = { type: 'coupon', cId }; render(); }

    // 商品項目操作
    function selectItemImageZone(gId, iId) { activeImageTarget = { type: 'item', gId, iId }; render(); }
    function toggleGroup(id) { const g = appData.groups.find(x => x.id === id); if(g) { g.collapsed = !g.collapsed; saveData(); } }
    function addNewGroup() { const name = prompt("請輸入新分類名稱：", "新分類"); if(name) { appData.groups.push({ id: 'g_' + Date.now(), name, collapsed: false, items: [] }); saveData(); } }
    function editGroupName(id) { const g = appData.groups.find(x => x.id === id); if(g) { const n = prompt("修改分類名稱：", g.name); if(n) { g.name = n; saveData(); } } }
    function deleteGroup(id) { if(confirm("確定刪除此分類？")) { appData.groups = appData.groups.filter(x => x.id !== id); saveData(); } }
    function addItem(id) { const g = appData.groups.find(x => x.id === id); if(g) { g.items.push({ id: 'i_' + Date.now(), name: '新商品', note: '', price: '', image: '', checked: false }); g.collapsed = false; saveData(); } }
    
    function updateItemInMemory(gId, iId, field, val) { 
      const g = appData.groups.find(x => x.id === gId); 
      if(g) { 
        const i = g.items.find(x => x.id === iId); 
        if(i) {
          i[field] = val;
          if (field === 'price') {
            calculateTotals();
          }
        }
      } 
    }
    
    function toggleCheck(gId, iId) { const g = appData.groups.find(x => x.id === gId); if(g) { const i = g.items.find(x => x.id === iId); if(i) { i.checked = !i.checked; saveData(); } } }
    function deleteItem(gId, iId) { const g = appData.groups.find(x => x.id === gId); if(g) { g.items = g.items.filter(x => x.id !== iId); saveData(); } }

    // 貼上事件監聽
    window.addEventListener('paste', function(e) {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      let blob = null;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') === 0) { blob = items[i].getAsFile(); break; }
      }

      if (blob) {
        if (!activeImageTarget) {
          alert("請先點擊要貼上照片的灰色區域！");
          return;
        }
        processImageFile(blob, activeImageTarget);
      }
    });

    function uploadCouponImage(e, cId) { if(e.target.files[0]) processImageFile(e.target.files[0], { type: 'coupon', cId }); }
    function uploadItemImage(e, gId, iId) { if(e.target.files[0]) processImageFile(e.target.files[0], { type: 'item', gId, iId }); }

    function processImageFile(file, target) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.src = evt.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxW = 300; const scale = maxW / img.width;
          canvas.width = maxW; canvas.height = img.height * scale;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const base64 = canvas.toDataURL('image/jpeg', 0.7);

          if (target.type === 'coupon') {
            const c = appData.coupons.find(x => x.id === target.cId);
            if(c) c.image = base64;
          } else if (target.type === 'item') {
            const g = appData.groups.find(x => x.id === target.gId);
            if(g) {
              const i = g.items.find(x => x.id === target.iId);
              if(i) i.image = base64;
            }
          }
          saveData();
        }
      };
      reader.readAsDataURL(file);
    }

    function escapeHtml(str) { return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    render();
  </script>
</body>
</html>
